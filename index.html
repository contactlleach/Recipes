<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Recipe Cards | My Kitchen</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap');

    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 32px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-tag {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .search-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-box {
      flex-grow: 1;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      background: var(--surface);
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }

    .view-toggle {
      display: flex;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 3px;
      gap: 3px;
      flex-shrink: 0;
    }

    .toggle-btn {
      border: none;
      background: transparent;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: #0f172a;
      color: #ffffff;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Montserrat', sans-serif;
    }

    .pill:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .pill.kids-pill.active {
      background: #f59e0b;
      border-color: #d97706;
      color: #ffffff;
    }

    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card-item {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .card-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      border-color: var(--primary);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 8px;
      text-decoration: none;
      color: inherit;
    }

    .card-meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-id {
      background: #f1f5f9;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .card-time {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-top: 2px;
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
      padding-top: 6px;
    }

    .mini-badge {
      font-size: 10px;
      font-weight: 600;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      color: #475569;
    }

    .kids-toggle-btn {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
      font-family: inherit;
      color: var(--text-muted);
    }

    .kids-toggle-btn.liked {
      background: #fef3c7;
      border-color: #fde68a;
      color: #92400e;
      font-weight: 700;
    }

    .card-footer {
      border-top: 1px solid #f1f5f9;
      padding: 10px 16px;
      background: #fafbfc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-footer strong {
      color: var(--primary-dark);
      font-weight: 700;
    }

    .table-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    th {
      background: #f8fafc;
      padding: 12px 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1.5px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    th.sort-active {
      color: var(--primary);
    }

    th::after {
      content: ' ⇅';
      font-size: 10px;
      opacity: 0.3;
    }

    th.sort-asc::after {
      content: ' ▲';
      opacity: 1;
    }

    th.sort-desc::after {
      content: ' ▼';
      opacity: 1;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #fafbfc;
    }

    .table-recipe-title {
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      display: block;
    }

    .table-recipe-title:hover {
      color: var(--primary);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <span class="brand-tag">Digital Recipe Hub</span>
    <h1>My Recipe Collection</h1>
    <p class="subtitle">Print-ready A5 HelloFresh-style cards with portion scaling & macros</p>
  </header>

  <div class="controls">
    <div class="search-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by name, ingredient, ID, or 'kids' (e.g., tuna, lamb, BK-01)...">
      </div>
      <div class="view-toggle">
        <button class="toggle-btn active" id="btnGrid" onclick="switchView('grid')">▦ Tiles</button>
        <button class="toggle-btn" id="btnTable" onclick="switchView('table')">≡ Table</button>
      </div>
    </div>

    <div class="filter-pills">
      <button class="pill active" onclick="filterCategory('all', this)">All Recipes</button>
      <button class="pill kids-pill" onclick="filterCategory('kids', this)">🧒 Kids Liked</button>
      <button class="pill" onclick="filterCategory('breakfast', this)">Breakfast</button>
      <button class="pill" onclick="filterCategory('meat', this)">Meat & Poultry</button>
      <button class="pill" onclick="filterCategory('veggie', this)">Vegetarian & Vegan</button>
      <button class="pill" onclick="filterCategory('pantry', this)">Pantry & Pulses</button>
    </div>
  </div>

  <div class="grid-view" id="recipeGrid"></div>

  <div class="table-container hidden" id="recipeTable">
    <table>
      <thead>
        <tr>
          <th onclick="sortTable(0, 'str')">ID</th>
          <th onclick="sortTable(1, 'str')">Recipe Name</th>
          <th onclick="sortTable(2, 'str')">Category</th>
          <th onclick="sortTable(3, 'num')">Time (min)</th>
          <th onclick="sortTable(4, 'num')">Calories</th>
          <th onclick="sortTable(5, 'num')">Protein (g)</th>
          <th onclick="sortTable(6, 'bool')">Kids Liked</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const baseRecipes = [
    { id: 'BK-01', title: 'Whipped Berry & Nut Butter Protein Bowl', category: 'breakfast', catName: 'Breakfast', time: 5, kcal: 370, protein: 32, defaultKids: true, link: 'card_BK-01_whipped_berry_bowl.html', tags: ['No-Cook', 'Glucose Friendly'], keywords: 'yoghurt chia breakfast berries no-cook' },
    { id: 'HF-60', title: 'Speedy Middle Eastern Harissa Lamb with Bulgur', category: 'meat', catName: 'Meat & Poultry', time: 25, kcal: 565, protein: 38, defaultKids: false, link: 'card1_speedy_harissa_lamb.html', tags: ['Bulk Cook', 'High Protein'], keywords: 'lamb mince bulgur wheat peppers' },
    { id: 'HF-59', title: 'Quick Greek Style Oregano Chicken Pasta Salad', category: 'meat', catName: 'Meat & Poultry', time: 25, kcal: 510, protein: 42, defaultKids: true, link: 'card4_greek_oregano_chicken_pasta.html', tags: ['Cold Lunch', 'High Protein'], keywords: 'chicken pasta ditali cucumber' },
    { id: 'HF-56', title: 'North Indian Roasted Cauliflower & Lentil Dal', category: 'veggie', catName: 'Vegetarian & Vegan', time: 35, kcal: 410, protein: 18, defaultKids: false, link: 'card2_cauliflower_dal.html', tags: ['Freeze Safe', 'High Fibre'], keywords: 'cauliflower lentil dal coconut' },
    { id: 'HF-52', title: "Beetroot, Sweet Potato & Goat's Cheese Bowl", category: 'veggie', catName: 'Vegetarian & Vegan', time: 25, kcal: 480, protein: 16, defaultKids: false, link: 'card_HF-52_beetroot_goats_cheese_couscous.html', tags: ['Quick Prep', 'Source Fibre'], keywords: 'couscous beetroot sweet potato goats cheese' },
    { id: 'EP-01', title: 'Garlic Butter Chicken with Quinoa & Greens', category: 'meat', catName: 'Meat & Poultry', time: 35, kcal: 540, protein: 47, defaultKids: true, link: 'card3_garlic_butter_chicken_quinoa.html', tags: ['High Protein', 'Gluten Free'], keywords: 'chicken quinoa broccoli kale garlic butter' },
    { id: 'EP-02', title: 'Cheeky Quinoa with Mushroom & Crispy Tofu', category: 'veggie', catName: 'Vegetarian & Vegan', time: 35, kcal: 460, protein: 21, defaultKids: false, link: 'card4_cheeky_quinoa_mushroom_tofu.html', tags: ['Vegan', 'Gluten Free'], keywords: 'tofu quinoa mushrooms vegan gluten-free' },
    { id: 'CB-01', title: 'Smoky Mexican Black Bean & Salsa Skillet', category: 'pantry', catName: 'Pantry & Pulses', time: 15, kcal: 380, protein: 19, defaultKids: true, link: 'card_CB-01_black_bean_skillet.html', tags: ['Low GI', 'Budget Batch'], keywords: 'black beans sweetcorn salsa greek yogurt skillet' },
    { id: 'CB-02', title: 'Zesty Italian Lentil & Cannellini Warm Salad', category: 'pantry', catName: 'Pantry & Pulses', time: 12, kcal: 340, protein: 17, defaultKids: false, link: 'card_CB-02_lentil_cannellini_salad.html', tags: ['High Fibre', 'Low GI'], keywords: 'lentils cannellini beans sun-dried tomatoes' },
    { id: 'CB-03', title: 'Tuscan Sun-Dried Tomato & Herb Tuna Skillet', category: 'pantry', catName: 'Pantry & Pulses', time: 10, kcal: 410, protein: 34, defaultKids: false, link: 'card_CB-03_tuscan_tuna_skillet.html', tags: ['High Protein', 'Glucose Friendly'], keywords: 'tuna cannellini beans peppers pesto quick lunch pantry' }
  ];

  function loadKidsPreferences() {
    const saved = localStorage.getItem('recipe_kids_liked');
    if (!saved) return {};
    try { return JSON.parse(saved); } catch (e) { return {}; }
  }

  function saveKidsPreferences(prefs) {
    localStorage.setItem('recipe_kids_liked', JSON.stringify(prefs));
  }

  let kidsPrefs = loadKidsPreferences();

  let recipes = baseRecipes.map(r => ({
    ...r,
    kids: (kidsPrefs[r.id] !== undefined) ? kidsPrefs[r.id] : r.defaultKids
  }));

  function toggleKidsLiked(recipeId, event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    const recipe = recipes.find(r => r.id === recipeId);
    if (!recipe) return;

    recipe.kids = !recipe.kids;
    kidsPrefs[recipeId] = recipe.kids;
    saveKidsPreferences(kidsPrefs);

    renderGrid();
    renderTable();
  }

  let currentView = 'grid';
  let activeCategory = 'all';
  let currentSortCol = null;
  let currentSortAsc = true;

  function switchView(view) {
    currentView = view;
    document.getElementById('btnGrid').classList.toggle('active', view === 'grid');
    document.getElementById('btnTable').classList.toggle('active', view === 'table');

    document.getElementById('recipeGrid').classList.toggle('hidden', view !== 'grid');
    document.getElementById('recipeTable').classList.toggle('hidden', view !== 'table');
  }

  function filterCategory(cat, element) {
    activeCategory = cat;
    document.querySelectorAll('.pill').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    applyFilters();
  }

  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', applyFilters);

  function matchesFilter(r, query) {
    let matchCat = false;
    if (activeCategory === 'all') matchCat = true;
    else if (activeCategory === 'kids') matchCat = r.kids === true;
    else matchCat = r.category === activeCategory;

    const fullString = `${r.id} ${r.title} ${r.catName} ${r.keywords} ${r.kids ? 'kids liked family' : ''}`.toLowerCase();
    const matchSearch = fullString.includes(query);

    return matchCat && matchSearch;
  }

  function renderGrid() {
    const grid = document.getElementById('recipeGrid');
    const query = searchInput.value.toLowerCase().trim();
    grid.innerHTML = '';

    recipes.forEach(r => {
      const isVisible = matchesFilter(r, query);
      const card = document.createElement('div');
      card.className = `card-item ${isVisible ? '' : 'hidden'}`;

      const tagsHtml = r.tags.map(t => `<span class="mini-badge">${t}</span>`).join('');

      card.innerHTML = `
        <a class="card-body" href="${r.link}">
          <div class="card-meta-top">
            <span class="card-id">${r.id}</span>
            <span class="card-time">⏱ ${r.time} mins</span>
          </div>
          <h2 class="card-title">${r.title}</h2>
          <div class="card-badges">
            ${tagsHtml}
          </div>
        </a>
        <div class="card-footer">
          <div>
            <button class="kids-toggle-btn ${r.kids ? 'liked' : ''}" onclick="toggleKidsLiked('${r.id}', event)">
              ${r.kids ? '🧒 Kids Liked ⭐' : '🧒 Kids? (Click)'}
            </button>
          </div>
          <div>
            <span>${r.kcal} kcal</span> • <strong>${r.protein}g P</strong>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const query = searchInput.value.toLowerCase().trim();
    tbody.innerHTML = '';

    recipes.forEach(r => {
      const isVisible = matchesFilter(r, query);
      if (!isVisible) return;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="card-id">${r.id}</span></td>
        <td><a href="${r.link}" class="table-recipe-title">${r.title}</a></td>
        <td><span class="mini-badge">${r.catName}</span></td>
        <td>${r.time} mins</td>
        <td>${r.kcal} kcal</td>
        <td><strong>${r.protein}g</strong></td>
        <td>
          <button class="kids-toggle-btn ${r.kids ? 'liked' : ''}" onclick="toggleKidsLiked('${r.id}', event)">
            ${r.kids ? '⭐ Liked' : '— Set'}
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function applyFilters() {
    renderGrid();
    renderTable();
  }

  function sortTable(colIndex, type) {
    const ths = document.querySelectorAll('th');
    
    if (currentSortCol === colIndex) {
      currentSortAsc = !currentSortAsc;
    } else {
      currentSortCol = colIndex;
      currentSortAsc = true;
    }

    ths.forEach((th, idx) => {
      th.classList.remove('sort-active', 'sort-asc', 'sort-desc');
      if (idx === colIndex) {
        th.classList.add('sort-active', currentSortAsc ? 'sort-asc' : 'sort-desc');
      }
    });

    const keyMap = ['id', 'title', 'catName', 'time', 'kcal', 'protein', 'kids'];
    const key = keyMap[colIndex];

    recipes.sort((a, b) => {
      let valA = a[key];
      let valB = b[key];

      if (type === 'num') {
        return currentSortAsc ? valA - valB : valB - valA;
      } else if (type === 'bool') {
        return currentSortAsc ? (valA === valB ? 0 : valA ? -1 : 1) : (valA === valB ? 0 : valA ? 1 : -1);
      } else {
        return currentSortAsc 
          ? String(valA).localeCompare(String(valB)) 
          : String(valB).localeCompare(String(valA));
      }
    });

    applyFilters();
  }

  renderGrid();
  renderTable();
</script>

</body>
</html>
